<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CropGuard Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background: linear-gradient(270deg, #283106, #777E5C, #C7C2AB, #D1DBBD, #DFE0DC);
      background-size: 1000% 1000%;
      animation: moveGradient 18s ease infinite;
      color: #283106;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    @keyframes moveGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1rem;
      color: #3e4a1f;
      margin-bottom: 40px;
      max-width: 650px;
    }

    .button-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px 60px;
      justify-items: center;
      align-items: center;
      width: 80%;
      max-width: 900px;
    }

    .feature-button {
      background-color: #777E5C;
      color: #fff;
      border: none;
      border-radius: 15px;
      padding: 20px 50px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      max-width: 260px;
      box-shadow: 0 5px 15px rgba(40, 49, 6, 0.3);
    }

    .feature-button:hover {
      background-color: #283106;
      transform: scale(1.08);
    }

    footer {
      margin-top: 60px;
      color: #283106;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>Welcome to CropGuard</h1>
  <p>Empowering farmers with AI-driven insights, smart tools, and real-time data for a better yield.</p>

  <div class="button-container">
    <button class="feature-button" id="btnDiary">Farm Diary</button>

    <!-- ✅ Smart Crop Planner Added -->
    <button class="feature-button" id="btnCropPlanner">Smart Crop Planner</button>

    
    <button class="feature-button" id="btnEquipment">Farm Equipment Sharing</button>
    <button class="feature-button" id="btnMarket">Market Price Tracker</button>
    <button class="feature-button" id="btnLearning">Farmer Learning Hub</button>
    <button class="feature-button" id="btnChatbot">AI Chatbot</button>
  </div>


  <footer>
    <p>© 2025 CropGuard | Smart Farming for a Better Tomorrow</p>
  </footer>
<a href="{{ url_for('intro') }}" class="back-btn">⬅ Go back</a>
  <script>
    document.getElementById('btnDiary').onclick = function() { 
      window.location.href = "{{ url_for('diary') }}"; 
    };

    // ⭐ NEW → Smart Crop Planner redirect
    document.getElementById('btnCropPlanner').onclick = function() { 
      window.location.href = "{{ url_for('crop_planner') }}"; 
    };


    document.getElementById('btnEquipment').onclick = function() { 
      window.location.href = "{{ url_for('equipment') }}"; 
    };

    document.getElementById('btnMarket').onclick = function() { 
      window.location.href = "{{ url_for('market') }}"; 
    };

    document.getElementById('btnLearning').onclick = function() { 
      window.location.href = "{{ url_for('learning') }}"; 
    };

    document.getElementById('btnChatbot').onclick = function() { 
      window.location.href = "{{ url_for('chatbot_page') }}"; 
    };
  </script>

</body>
</html>
